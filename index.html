<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fall Detection Dashboard PRO</title>

<style>
:root{
  --bg:#eef2ff;
  --panel:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --primary:#2563eb;
  --danger:#ef4444;
  --warning:#f59e0b;
  --ok:#22c55e;
}
.dark{
  --bg:#0f172a;
  --panel:#1e293b;
  --text:#e2e8f0;
  --muted:#94a3b8;
}
body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
}
.shell{ max-width:1400px; margin:auto; padding:20px; }
.topbar{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:15px;
}
.btn{
  background:var(--primary); color:#fff;
  border:0; padding:8px 12px; border-radius:10px;
  cursor:pointer;
}
.panel{
  background:var(--panel);
  border-radius:16px;
  padding:12px;
  box-shadow:0 6px 16px rgba(0,0,0,.08);
}
.layout{
  display:grid;
  grid-template-columns:1.2fr 1fr 1.3fr;
  gap:12px;
}
.badge{ padding:4px 8px; border-radius:999px; font-size:12px; font-weight:700; }
.crit{ background:#fee2e2; color:#991b1b;}
.warn{ background:#fef3c7; color:#92400e;}
.ok{ background:#dcfce7; color:#166534;}

.roomRow{
  display:flex; justify-content:space-between;
  padding:10px; border-bottom:1px solid #eee;
  cursor:pointer;
}
.roomRow:hover{ background:#f1f5f9; }

.alert{
  border-left:4px solid var(--danger);
  background:#fff;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  animation:fadeIn .4s ease;
}
@keyframes fadeIn{ from{opacity:0; transform:translateY(5px)} }

.timeline{ max-height:500px; overflow:auto; }

.insight{
  background:#e0e7ff;
  padding:8px;
  border-radius:10px;
  margin:6px 0;
  font-size:13px;
}
</style>
</head>

<body>
<div id="root"></div>

<script type="module">
import React, {useState, useEffect, useMemo} from "https://esm.sh/react@18";
import {createRoot} from "https://esm.sh/react-dom@18/client";

const now = ()=> new Date();

function minutesAgo(min){
  return new Date(Date.now()-min*60000);
}

function random(arr){ return arr[Math.floor(Math.random()*arr.length)] }

function App(){

const [dark,setDark]=useState(false);
const [rooms,setRooms]=useState([]);
const [alerts,setAlerts]=useState([]);
const [events,setEvents]=useState([]);
const [selected,setSelected]=useState(null);
const [filterRisk,setFilterRisk]=useState("ALL");
const [showAlertsOnly,setShowAlertsOnly]=useState(false);

const nurse = {name:"Nurse Jamie", shiftStart:minutesAgo(120)};

// SOUND
function playSound(){
  const audio = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");
  audio.play();
}

// INIT
useEffect(()=>{
  const r=[];
  for(let i=1;i<=80;i++){
    r.push({
      id:i,
      label:"Room "+i,
      status:"NORMAL",
      risk:random(["Low","Med","High"]),
      lastMove:minutesAgo(Math.random()*10)
    });
  }
  setRooms(r);
},[]);

// SIMULATION
useEffect(()=>{
  const t=setInterval(()=>{
    setRooms(prev=>{
      const copy=[...prev];
      const r=random(copy);

      const type=random(["NORMAL","WARNING","CRITICAL"]);

      if(type==="CRITICAL"){
        playSound();
        setAlerts(a=>[
          {id:crypto.randomUUID(), room:r.id, time:now(), note:"Fall detected", assigned:null},
          ...a
        ]);
      }

      r.status=type;

      setEvents(e=>[
        {id:crypto.randomUUID(), room:r.id, type, time:now()},
        ...e.slice(0,100)
      ]);

      return copy;
    });
  },4000);
  return ()=>clearInterval(t);
},[]);

// COUNTS
const counts=useMemo(()=>{
  return {
    crit: rooms.filter(r=>r.status==="CRITICAL").length,
    warn: rooms.filter(r=>r.status==="WARNING").length
  }
},[rooms]);

// FILTER
const filteredRooms=rooms.filter(r=>{
  if(filterRisk!=="ALL" && r.risk!==filterRisk) return false;
  if(showAlertsOnly && !alerts.some(a=>a.room===r.id)) return false;
  return true;
});

// AI INSIGHTS
const insights=useMemo(()=>{
  return alerts.slice(0,3).map(a=>`Room ${a.room} needs attention (${Math.floor((now()-a.time)/60000)}m ago)`);
},[alerts]);

function ack(id){
  setAlerts(a=>a.filter(x=>x.id!==id));
}

return (
<div className={dark?"dark shell":"shell"}>

<div className="topbar">
  <h2>Fall Detection PRO</h2>
  <div>
    {nurse.name} • Shift {(Math.floor((now()-nurse.shiftStart)/3600000))}h
    <button className="btn" onClick={()=>setDark(!dark)}>🌙</button>
  </div>
</div>

<div className="panel" style={{marginBottom:10}}>
  Critical: {counts.crit} | Warning: {counts.warn}
</div>

<div className="layout">

{/* ROOMS */}
<div className="panel">
  <h3>Rooms</h3>

  <select onChange={e=>setFilterRisk(e.target.value)}>
    <option>ALL</option><option>Low</option><option>Med</option><option>High</option>
  </select>

  <label>
    <input type="checkbox" onChange={()=>setShowAlertsOnly(v=>!v)}/> Alerts only
  </label>

  {filteredRooms.map(r=>(
    <div key={r.id} className="roomRow" onClick={()=>setSelected(r)}>
      <div>{r.label}</div>
      <div className={"badge "+(r.status==="CRITICAL"?"crit":r.status==="WARNING"?"warn":"ok")}>
        {r.status}
      </div>
    </div>
  ))}
</div>

{/* ALERTS */}
<div className="panel">
  <h3>Alerts</h3>
  {alerts.map(a=>(
    <div key={a.id} className="alert">
      <b>Room {a.room}</b><br/>
      {Math.floor((now()-a.time)/1000)}s ago<br/>
      <button onClick={()=>ack(a.id)}>Acknowledge</button>
      <button onClick={()=>setSelected(rooms.find(r=>r.id===a.room))}>View</button>
    </div>
  ))}
</div>

{/* TIMELINE + AI */}
<div className="panel">
  <h3>Timeline</h3>
  <div className="timeline">
    {events.map(e=>(
      <div key={e.id}>
        Room {e.room} — {e.type}
      </div>
    ))}
  </div>

  <h3>AI Insights</h3>
  {insights.map((i,idx)=>(
    <div key={idx} className="insight">{i}</div>
  ))}
</div>

</div>

{selected && (
<div style={{
  position:"fixed", inset:0, background:"rgba(0,0,0,.5)"
}} onClick={()=>setSelected(null)}>

<div style={{
  background:"#fff",
  width:"400px",
  margin:"100px auto",
  padding:"20px",
  borderRadius:"12px"
}} onClick={e=>e.stopPropagation()}>

<h3>{selected.label}</h3>
<p>Status: {selected.status}</p>
<p>Risk: {selected.risk}</p>

</div>
</div>
)}

</div>
);
}

createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
